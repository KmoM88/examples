[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "examples_rclpy_minimal_subscriber"
version = "0.19.7"
description = "Examples of minimal subscribers using rclpy."
license = { text = "Apache-2.0" }
authors = [
    { name = "Mikael Arguedas", email = "mikael@osrfoundation.org" },
]
maintainers = [
    { name = "Aditya Pande", email = "aditya.pande@openrobotics.org" },
    { name = "Alejandro Hernandez Cordero", email = "alejandro@openrobotics.org" },
]
keywords = ["ROS"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
subscriber_old_school = "examples_rclpy_minimal_subscriber.subscriber_old_school:main"
subscriber_lambda = "examples_rclpy_minimal_subscriber.subscriber_lambda:main"
subscriber_member_function = "examples_rclpy_minimal_subscriber.subscriber_member_function:main"
